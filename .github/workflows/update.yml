name: تحديث الأخبار

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  models: read

concurrency:
  group: update-news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Update data (loop until the next scheduled start)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          END=$(( $(date +%s) + 5*3600 + 40*60 ))
          while true; do
            # always start from the latest remote state: an overlapping run may have pushed since we checked out
            git fetch -q origin main && git reset -q --hard origin/main || true
            python3 scripts/update.py || true
            git add data
            if ! git diff --cached --quiet; then
              git commit -q -m "تحديث تلقائي $(TZ=Asia/Riyadh date '+%Y-%m-%d %H:%M')"
              git push -q origin HEAD:main || { git fetch -q origin main; git reset -q --hard origin/main; }
            fi
            [ "$(date +%s)" -ge "$END" ] && break
            sleep 300
          done
