name: تحديث الأخبار

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (GitHub may delay a few minutes)
  workflow_dispatch: {}

permissions:
  contents: write
  models: read

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Update data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update.py
      - name: Commit
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "تحديث تلقائي $(TZ=Asia/Riyadh date '+%Y-%m-%d %H:%M')"
          git pull --rebase -q && git push
